#Pingi-Backend Docker Compose

services:
  app:
    build: .
    container_name: pingi-backend
    restart: unless-stopped
    ports:
      - "8100:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pingi-postgres:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      PORT: "${PORT}"
      AI_API_URL: http://pingi-ai:8001
      MAX_FILE_SIZE: "${MAX_FILE_SIZE}"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      FRONTEND_URL: "${FRONTEND_URL}"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - pingi_net

volumes:
  uploads_data:

networks:
  pingi_net:
    external: true