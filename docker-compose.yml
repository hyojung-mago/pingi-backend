#Pingi-Backend Docker Compose

services:
  app:
    build: .
    container_name: pingi-backend
    restart: unless-stopped
    ports:
      - "8100:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:pingi123!!@pingi-postgres:5432/pingi?schema=public
      NODE_ENV: production
      PORT: "8000"
      AI_API_URL: http://pingi-ai:8001
      MAX_FILE_SIZE: "10485760"
      CORS_ORIGIN: "https://pingi.mago52.com,http://localhost:5173"
      FRONTEND_URL: "https://pingi.mago52.com"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - pingi_net

volumes:
  uploads_data:

networks:
  pingi_net:
    external: true