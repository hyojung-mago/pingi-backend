<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>핑이 API 문서</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    .swagger-ui .topbar {
      background-color: #da291c;
    }
    .swagger-ui .topbar .download-url-wrapper .download-url-button {
      background-color: #ffd166;
      color: #2a1a0a;
    }
    .swagger-ui .info .title {
      color: #da291c;
    }
    .swagger-ui .opblock.opblock-post {
      border-color: #da291c;
      background: rgba(218, 41, 28, 0.05);
    }
    .swagger-ui .opblock.opblock-post .opblock-summary-method {
      background: #da291c;
    }
    .swagger-ui .opblock.opblock-get {
      border-color: #27ae60;
      background: rgba(39, 174, 96, 0.05);
    }
    .swagger-ui .opblock.opblock-get .opblock-summary-method {
      background: #27ae60;
    }
    .swagger-ui .opblock.opblock-patch {
      border-color: #f39c12;
      background: rgba(243, 156, 18, 0.05);
    }
    .swagger-ui .opblock.opblock-patch .opblock-summary-method {
      background: #f39c12;
    }
    .swagger-ui .btn.execute {
      background-color: #da291c;
      border-color: #da291c;
    }
    .swagger-ui .btn.execute:hover {
      background-color: #b8231a;
    }
    #spec-load-error {
      display: none;
      margin: 1.5rem;
      padding: 1rem;
      background: #fee;
      border: 1px solid #da291c;
      color: #421;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="spec-load-error" role="alert"></div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
  <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script>
    window.onload = function () {
      const errEl = document.getElementById('spec-load-error');

      fetch('/api-docs/openapi.yaml', { credentials: 'same-origin' })
        .then(function (r) {
          if (!r.ok) {
            throw new Error('스펙 로드 실패 (' + r.status + ')');
          }
          return r.text();
        })
        .then(function (yamlText) {
          const spec = window.jsyaml.load(yamlText);
          window.ui = SwaggerUIBundle({
            spec: spec,
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [
              SwaggerUIBundle.presets.apis,
              SwaggerUIStandalonePreset
            ],
            plugins: [
              SwaggerUIBundle.plugins.DownloadUrl
            ],
            layout: 'StandaloneLayout',
            defaultModelsExpandDepth: -1,
            docExpansion: 'list',
            filter: true,
            showExtensions: true,
            showCommonExtensions: true
          });
        })
        .catch(function (e) {
          errEl.style.display = 'block';
          errEl.textContent = e.message || String(e);
        });
    };
  </script>
</body>
</html>
