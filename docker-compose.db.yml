#Pingi-Postgres Docker Compose

services:
  postgres:
    image: postgres:16-alpine
    container_name: pingi-postgres
    restart: unless-stopped
    ports:
      - "25432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pingi_net

volumes:
  postgres_data:

networks:
  pingi_net:
    name: pingi_net